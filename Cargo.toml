[package]
name = "ferrixel"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Sebastian Software GmbH"]
description = "Experimental pipeline-first Rust image processing engine"
repository = "https://github.com/sebastian-software/ferrixel"
readme = "README.md"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
jpeg-read = ["dep:zune-jpeg"]
jpeg-xl-read = ["dep:jxl-oxide"]

[dependencies]
zune-jpeg = { version = "0.5.15", optional = true, default-features = false, features = ["std"] }
jxl-oxide = { version = "0.12.6", optional = true, default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
