name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install AV1 assembler for optional rav1d backend
        run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - name: Format
        run: cargo fmt --all --check
      - name: Test core without codecs
        run: cargo test --all-targets
      - name: Test with optional codecs
        run: cargo test --all-targets --all-features
      - name: Lint core without codecs
        run: cargo clippy --all-targets -- -D warnings
      - name: Lint with optional codecs
        run: cargo clippy --all-targets --all-features -- -D warnings
